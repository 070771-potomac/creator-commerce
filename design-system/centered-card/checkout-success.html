<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centered-card — Checkout success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="../theme.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button">☾ Dark</button>
  <div class="center-screen">
    <div class="card auth-card">
      <div class="card-content stack gap-4" style="text-align:center;align-items:center;">
        <div class="icon-circle ok">✓</div>
        <div class="stack gap-2">
          <h1 class="font-heading" style="font-size:1.35rem;margin:0;">Payment confirmed</h1>
          <p class="muted" style="margin:0;">Thanks for your purchase. Your download is ready in your library.</p>
        </div>
        <a class="btn btn-primary btn-block" href="../dashboard/downloads.html">Go to downloads</a>
        <a class="btn btn-ghost btn-block" href="../storefront/creator.html">Continue browsing</a>
      </div>
    </div>
  </div>
</body>
</html>
