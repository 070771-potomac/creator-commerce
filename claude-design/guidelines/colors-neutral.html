<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--background)"></div><div class="n">background</div><div class="v">--background</div></div><div class="sw"><div class="chip" style="background:var(--sidebar)"></div><div class="n">sidebar</div><div class="v">--sidebar</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">muted</div><div class="v">--muted</div></div><div class="sw"><div class="chip" style="background:var(--secondary)"></div><div class="n">secondary</div><div class="v">--secondary</div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div class="n">border</div><div class="v">--border</div></div></div></body></html>
