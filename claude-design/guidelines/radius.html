<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row" style="gap:20px;align-items:flex-start"><div class="sw" style="width:96px"><div style="height:64px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-lg)"></div><div class="n">cards, buttons</div><div class="v">--radius-* = 0</div></div><div class="sw" style="width:96px"><div style="height:64px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-lg)"></div><div class="n">inputs, badges</div><div class="v">rounded-none</div></div><div class="sw" style="width:96px"><div style="height:24px;width:44px;margin-top:20px;background:var(--primary);border-radius:var(--radius-full)"></div><div class="n" style="margin-top:20px">switch</div><div class="v">--radius-full</div></div></div></body></html>
