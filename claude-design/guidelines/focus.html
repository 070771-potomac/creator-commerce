<!-- @dsCard group="Spacing" viewport="700x110" name="Focus ring" subtitle="3px ring at 50% --ring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row" style="gap:20px;padding:6px">
<input style="height:32px;width:220px;border-radius:var(--radius-lg);border:1px solid var(--ring);box-shadow:0 0 0 3px var(--ring-focus);padding:0 10px;font:inherit;font-size:14px;outline:none" value="Focused input">
<input style="height:32px;width:220px;border-radius:var(--radius-lg);border:1px solid var(--destructive);box-shadow:0 0 0 3px color-mix(in oklch,var(--destructive) 20%,transparent);padding:0 10px;font:inherit;font-size:14px;outline:none" value="Invalid input"></div></body></html>
