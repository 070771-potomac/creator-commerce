<!-- @dsCard group="Colors" viewport="700x170" name="Dark theme" subtitle=".dark class overrides" -->
<!doctype html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px oklch(1 0 0 / 15%)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--background)"></div><div class="n">background</div><div class="v">--background</div></div><div class="sw"><div class="chip" style="background:var(--card)"></div><div class="n">card</div><div class="v">--card</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">muted</div><div class="v">--muted</div></div><div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="n">primary</div><div class="v">--primary</div></div><div class="sw"><div class="chip" style="background:var(--destructive)"></div><div class="n">destructive</div><div class="v">--destructive</div></div></div></body></html>
