<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Rings for surfaces, shadows for overlays" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row" style="gap:24px;padding:8px">
<div style="width:180px;height:100px;border-radius:var(--radius-xl);box-shadow:0 0 0 1px var(--ring-card);padding:12px">Card<div class="v">1px ring, fg/10</div></div>
<div style="width:180px;height:100px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card),var(--shadow-md);padding:12px">Popover / menu<div class="v">ring + shadow-md</div></div>
<div style="width:180px;height:100px;border-radius:var(--radius-xl);box-shadow:0 0 0 1px var(--ring-card),var(--shadow-lg);padding:12px">Dialog / toast<div class="v">ring + shadow-lg</div></div></div></body></html>
