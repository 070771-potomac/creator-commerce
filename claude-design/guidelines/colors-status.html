<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Destructive (repo) + warning (addition)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--destructive)"></div><div class="n">destructive</div><div class="v">--destructive</div></div><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">success</div><div class="v">--success</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="n">warning</div><div class="v">--warning</div></div><div class="sw"><div class="chip" style="background:var(--warning-foreground)"></div><div class="n">warning-foreground</div><div class="v">--warning-foreground</div></div></div></body></html>
