<!-- @dsCard group="Colors" viewport="700x130" name="Text" subtitle="Foreground roles" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:18px;color:var(--foreground)">Foreground — headings and body <span class="v">--foreground</span></div>
<div style="font-size:18px;color:var(--muted-foreground)">Muted — descriptions, meta, captions <span class="v">--muted-foreground</span></div>
<div style="font-size:18px;color:var(--primary)">Primary — links and active values <span class="v">--primary</span></div>
<div style="font-size:18px;color:var(--destructive)">Destructive — errors <span class="v">--destructive</span></div></div></body></html>
