<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--ring-card)}.n{font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="n">primary</div><div class="v">--primary</div></div><div class="sw"><div class="chip" style="background:var(--primary-foreground)"></div><div class="n">primary-foreground</div><div class="v">--primary-foreground</div></div><div class="sw"><div class="chip" style="background:var(--sidebar-primary)"></div><div class="n">sidebar-primary</div><div class="v">--sidebar-primary</div></div><div class="sw"><div class="chip" style="background:var(--ring)"></div><div class="n">ring</div><div class="v">--ring</div></div></div></body></html>
