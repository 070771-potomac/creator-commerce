<!-- @dsCard group="Components" viewport="700x320" name="Data" subtitle="Table" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_preview.js"></script>
<style>body{padding:20px;font-size:14px}.lbl{font:500 11px var(--font-mono);color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em}</style></head>
<body><div id="root"></div>
<script type="text/babel">
loadDS("../../").then(DS => {
const { Icon, Button, Badge, Separator, Skeleton, Tooltip, Avatar, Input, Textarea, Select, Label, Checkbox, Switch, Card, CardHeader, CardContent, CardFooter, Sheet, Dialog, Sidebar, SidebarGroup, SidebarItem, NavigationMenu, Table, Toast, EmptyState } = DS;
const Row = ({ label, children, gap = 8 }) => <div style={{ display: "grid", gridTemplateColumns: "96px 1fr", alignItems: "center", gap: 12 }}><span className="lbl">{label}</span><div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap }}>{children}</div></div>;
function App() {
const rows = [
  { id: 1, title: "Warm Film — Lightroom presets", type: "ZIP", status: "Published", sales: 42, price: "€19.00" },
  { id: 2, title: "Freelance pricing guide", type: "PDF", status: "Published", sales: 17, price: "€12.00" },
  { id: 3, title: "Lo-fi drum kit vol. 2", type: "Audio", status: "Draft", sales: 0, price: "€24.00" },
  { id: 4, title: "Notion content calendar", type: "PDF", status: "Published", sales: 88, price: "€9.00" }];
return <Card style={{ padding: "4px 0" }}><CardContent style={{ padding: "0 8px" }}><Table rows={rows} onRowClick={() => {}} columns={[
  { key: "title", label: "Product", render: r => <span style={{ fontWeight: 500 }}>{r.title}</span> },
  { key: "type", label: "Type", render: r => <Badge variant="secondary">{r.type}</Badge> },
  { key: "status", label: "Status", render: r => <Badge variant={r.status === "Published" ? "success" : "outline"}>{r.status}</Badge> },
  { key: "sales", label: "Sales", align: "right" }, { key: "price", label: "Price", align: "right" },
  { key: "x", label: "", align: "right", render: () => <Button variant="ghost" size="icon-sm" icon="ellipsis" /> }]} /></CardContent></Card>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
