<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_preview.js"></script>
<style>body{padding:20px;font-size:14px}.lbl{font:500 11px var(--font-mono);color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em}</style></head>
<body><div id="root"></div>
<script type="text/babel">
loadDS("../../").then(DS => {
const { Icon, Button, Badge, Separator, Skeleton, Tooltip, Avatar, Input, Textarea, Select, Label, Checkbox, Switch, Card, CardHeader, CardContent, CardFooter, Sheet, Dialog, Sidebar, SidebarGroup, SidebarItem, NavigationMenu, Table, Toast, EmptyState } = DS;
const Row = ({ label, children, gap = 8 }) => <div style={{ display: "grid", gridTemplateColumns: "96px 1fr", alignItems: "center", gap: 12 }}><span className="lbl">{label}</span><div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap }}>{children}</div></div>;
function App() {
return <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, alignItems: "start" }}>
  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
    <Toast variant="success" title="Product published" description="Live at /@alexpopovici/warm-film" action={<Button size="xs" variant="outline">View</Button>} />
    <Toast variant="error" title="Upload failed" description="Files must be under 256 MB." onClose={() => {}} />
    <Toast title="Link copied" />
  </div>
  <EmptyState icon="package" title="No products yet" description="Upload a file and publish it to your storefront." action={<Button icon="plus" size="sm">New product</Button>} />
</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
