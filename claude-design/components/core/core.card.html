<!-- @dsCard group="Components" viewport="700x330" name="Core" subtitle="Button, Badge, Avatar, Tooltip, Separator, Skeleton" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_preview.js"></script>
<style>body{padding:20px;font-size:14px}.lbl{font:500 11px var(--font-mono);color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em}</style></head>
<body><div id="root"></div>
<script type="text/babel">
loadDS("../../").then(DS => {
const { Icon, Button, Badge, Separator, Skeleton, Tooltip, Avatar, Input, Textarea, Select, Label, Checkbox, Switch, Card, CardHeader, CardContent, CardFooter, Sheet, Dialog, Sidebar, SidebarGroup, SidebarItem, NavigationMenu, Table, Toast, EmptyState } = DS;
const Row = ({ label, children, gap = 8 }) => <div style={{ display: "grid", gridTemplateColumns: "96px 1fr", alignItems: "center", gap: 12 }}><span className="lbl">{label}</span><div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap }}>{children}</div></div>;
function App() {
return <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
  <Row label="Button"><Button icon="plus">New product</Button><Button variant="outline">Duplicate</Button><Button variant="secondary">Secondary</Button><Button variant="ghost">Ghost</Button><Button variant="destructive" icon="trash-2">Delete</Button><Button variant="link">View storefront</Button></Row>
  <Row label="Sizes"><Button size="xs">xs</Button><Button size="sm">Small</Button><Button>Default</Button><Button size="lg" iconEnd="arrow-right">Large</Button><Button variant="outline" size="icon" icon="ellipsis" /><Button size="sm" disabled>Disabled</Button></Row>
  <Row label="Badge"><Badge variant="success">Published</Badge><Badge variant="outline">Draft</Badge><Badge variant="warning">Refund requested</Badge><Badge variant="destructive">Rejected</Badge><Badge variant="secondary" icon="file-text">PDF</Badge><Badge>New</Badge></Row>
  <Row label="Avatar"><Avatar name="Alexandru Popovici" size={24} /><Avatar name="Alexandru Popovici" /><Avatar name="Mara Pop" size={40} /><Tooltip content="Copy link"><Button variant="ghost" size="icon-sm" icon="link" /></Tooltip><span style={{ fontSize: 12, color: "var(--muted-foreground)" }}>← hover for tooltip</span></Row>
  <Row label="Separator"><div style={{ width: "100%" }}><Separator /></div></Row>
  <Row label="Skeleton"><Skeleton width={48} height={48} radius="var(--radius-lg)" /><div style={{ display: "flex", flexDirection: "column", gap: 8, flex: 1 }}><Skeleton height={14} width="60%" /><Skeleton height={14} width="35%" /></div></Row>
</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
